apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamflix.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels: { app: streamflix-api }
  template:
    metadata:
      labels: { app: streamflix-api }
    spec:
      serviceAccountName: {{ .Values.api.serviceAccountName }}
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef: { name: {{ include "streamflix.fullname" . }}-config }
        - secretRef: { name: streamflix-app-secret }
        readinessProbe:
          httpGet: { path: /health, port: 4000 }
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 4000 }
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
{{ toYaml .Values.api.resources | indent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: streamflix-api
spec:
  selector: { app: streamflix-api }
  ports:
  - port: 4000
    targetPort: 4000
