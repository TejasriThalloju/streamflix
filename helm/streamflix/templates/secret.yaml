{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: streamflix-app-secret
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  REDIS_URL: {{ .Values.secret.redisUrl | quote }}
{{- end }}
